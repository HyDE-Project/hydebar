# The Catppuccin Mocha preset palette.
#
# A whole appearance table: every key the `[appearance]` section of
# `config.toml` accepts works here, anything left out falls back to the
# built-in defaults. Copy this file to start a custom theme.

style = "Islands"
opacity = 0.95
bar_opacity = 0.0
greeting = true
follow_hyde = true
auto_scale = false
scale_factor = 1.0
island_borders = false

background_color = "#1e1e2e"
primary_color = "#cba6f7"
secondary_color = "#89b4fa"
success_color = "#a6e3a1"
danger_color = "#f38ba8"
warning_color = "#fab387"
text_color = "#cdd6f4"

workspace_colors = [
    "#89b4fa",
    "#cba6f7",
    "#f5c2e7",
    "#fab387",
    "#f9e2af",
    "#a6e3a1",
    "#94e2d5",
    "#89dceb",
    "#74c7ec",
    "#b4befe",
]
special_workspace_colors = ["#eba0ac"]

[menu]
opacity = 0.95
backdrop = 0.3
