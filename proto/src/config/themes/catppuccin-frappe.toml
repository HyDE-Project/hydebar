# The Catppuccin Frappe preset palette.
#
# A whole appearance table: every key the `[appearance]` section of
# `config.toml` accepts works here, anything left out falls back to the
# built-in defaults. Copy this file to start a custom theme.

style = "Islands"
opacity = 0.95
bar_opacity = 0.0
greeting = true
follow_hyde = true
auto_scale = false
scale_factor = 1.0
island_borders = false

background_color = "#303446"
primary_color = "#ca9ee6"
secondary_color = "#8caaee"
success_color = "#a6d189"
danger_color = "#e78284"
warning_color = "#fab387"
text_color = "#c6d0f5"

workspace_colors = [
    "#8caaee",
    "#ca9ee6",
    "#f4b8e4",
    "#ef9f76",
    "#e5c890",
    "#a6d189",
    "#81c8be",
    "#99d1db",
    "#85c1dc",
    "#babbf1",
]
special_workspace_colors = ["#ea999c"]

[menu]
opacity = 0.95
backdrop = 0.3
