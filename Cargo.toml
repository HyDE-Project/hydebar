[workspace]
members = ["proto", "core", "gui", "app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/HyDE-Project/hydebar"
homepage = "https://github.com/HyDE-Project/hydebar"

[workspace.dependencies]
quick-xml = "0.41"
ttf-parser = "0.25"
iced = { package = "iced_layershell", git = "https://github.com/MalpenZibo/iced_layershell", tag = "v0.2.1", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "lazy",
  "svg",
  "canvas",
] }
iced_futures = "0.14"
iced_core = "0.14"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.39"
tokio = { version = "1", features = ["full", "test-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
libpulse-binding = { version = "2", features = ["pa_v15"] }
log = { version = "0.4", features = ["serde"] }
flexi_logger = "0.31"
pipewire = "0.10"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
itertools = "0.15"
hex_color = { version = "3", features = ["serde"] }
udev = { version = "0.9", features = ["send", "sync"] }
toml = "1"
serde_ignored = "0.1"
toml_edit = "0.25"
freedesktop-icons = "0.4"
linicon-theme = "1"
serde_json = "1"
sha1_smol = "1"
image = "0.25"
resvg = { version = "0.48", default-features = false }
regex = "1"
serde_with = "3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
shellexpand = { version = "3", features = ["path"] }
inotify = "0.11"
libc = "0.2"
signal-hook-registry = "1"
masterror = "0.29"
futures = "0.3"
dirs = "6"
reqwest = { version = "0.13", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[patch.crates-io]
softbuffer = { git = "https://github.com/MalpenZibo/softbuffer", branch = "wayland-argb" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "warn"
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage)",
  "cfg(coverage_nightly)",
] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
let_underscore_future = "deny"
unwrap_used = "warn"
expect_used = "warn"
