# Supply-chain policy for the workspace, checked by `cargo deny check` in CI.
#
# An advisory is either fixed by an upgrade or written down here with the
# reason it is accepted, so a new one fails the build instead of joining a
# silent tally of allowed warnings.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `paste` is finished rather than abandoned: a proc macro with no API left
  # to grow, reached through `image` -> `exr` -> `pulp`. No replacement is
  # offered by the advisory and nothing in the workspace calls it directly.
  { id = "RUSTSEC-2024-0436", reason = "unmaintained proc macro pulled in by the image decoder" },
  # `rustybuzz` and `ttf-parser` are the text stack of `resvg`, which the
  # widget toolkit renders SVG icons with. Both are unmaintained upstream and
  # neither has a drop-in successor the toolkit accepts; the workspace cannot
  # replace them without replacing the renderer.
  { id = "RUSTSEC-2026-0206", reason = "unmaintained, reached through the toolkit's SVG renderer" },
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, reached through the toolkit's SVG renderer" },
]

# RUSTSEC-2026-0253, the panic-safety hole in `lru`, is reported by
# `cargo audit` but not by this check, which does not raise unsound advisories
# on its own. It needs a stored key whose `Drop` panics under `catch_unwind`;
# the only `lru` in the graph is the toolkit's glyph cache, whose values are
# plain bitmaps. Should the check start raising it, weigh it again rather than
# adding it to the list above unread.

[bans]
# The toolkit is pinned to a fork by git tag, and a git dependency carries no
# version requirement to check, so the rule cannot be enforced while the fork
# stands. Revisit when the layer-shell work lands in a published release.
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/MalpenZibo/iced_layershell",
  "https://github.com/MalpenZibo/softbuffer",
]

[licenses]
# Every licence the dependency graph carries today. A crate arriving under a
# licence not named here fails the check, so the question is answered once,
# in review, rather than after a release.
# `GPL-2.0-only` is deliberately absent. It cannot be combined with the
# licence this workspace is handed on under, and the one crate that names it
# offers `Apache-2.0` in the same breath — leaving it out of this list is what
# makes the check take the half that works.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-2.1-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
